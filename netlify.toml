[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  ignore = "exit 1"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
