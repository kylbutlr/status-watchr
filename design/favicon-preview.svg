<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title description">
  <title id="title">Status Watchr favicon preview</title>
  <desc id="description">Default, working, finished, and needs attention favicon states shown at large reference, app icon, favicon, and browser tab sizes, with attention alternatives.</desc>
  <defs>
    <linearGradient id="default-gradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0D0D0D" />
      <stop offset="0.48" stop-color="#3B4145" />
      <stop offset="1" stop-color="#899F98" />
    </linearGradient>
    <linearGradient id="working-gradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0D0D0D" />
      <stop offset="0.48" stop-color="#3B4145" />
      <stop offset="1" stop-color="#899F98" />
    </linearGradient>
    <linearGradient id="finished-gradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0D0D0D" />
      <stop offset="0.48" stop-color="#3B4145" />
      <stop offset="1" stop-color="#899F98" />
    </linearGradient>
    <linearGradient id="attention-gradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0D0D0D" />
      <stop offset="0.48" stop-color="#3B4145" />
      <stop offset="1" stop-color="#899F98" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28" />
    </filter>
    <symbol id="icon-default" viewBox="0 0 1024 1024">
      <rect x="92" y="92" width="840" height="840" rx="190" fill="url(#default-gradient)" />
      <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
        <path d="M382 372 C294 448 294 576 382 652" stroke-width="58" />
        <path d="M642 372 C730 448 730 576 642 652" stroke-width="58" />
        <path d="M292 292 C142 414 142 610 292 732" stroke-width="38" opacity="0.82" />
        <path d="M732 292 C882 414 882 610 732 732" stroke-width="38" opacity="0.82" />
      </g>
      <circle cx="512" cy="512" r="57" fill="#FFFFFF" />
    </symbol>
    <symbol id="icon-working" viewBox="0 0 1024 1024">
      <rect x="92" y="92" width="840" height="840" rx="190" fill="url(#working-gradient)" />
      <g fill="#FFFFFF">
        <ellipse cx="352" cy="512" rx="48" ry="58" />
        <ellipse cx="512" cy="512" rx="48" ry="58" />
        <ellipse cx="672" cy="512" rx="48" ry="58" />
      </g>
    </symbol>
    <symbol id="icon-finished" viewBox="0 0 1024 1024">
      <rect x="92" y="92" width="840" height="840" rx="190" fill="url(#finished-gradient)" />
      <path d="M512 250C526 402 622 498 774 512C622 526 526 622 512 774C498 622 402 526 250 512C402 498 498 402 512 250Z" fill="#FFFFFF" />
    </symbol>
    <symbol id="icon-attention" viewBox="0 0 1024 1024">
      <rect x="92" y="92" width="840" height="840" rx="190" fill="url(#attention-gradient)" />
      <path d="M354 354 670 670M670 354 354 670" fill="none" stroke="#FFFFFF" stroke-width="66" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-cross" viewBox="0 0 1024 1024">
      <rect x="92" y="92" width="840" height="840" rx="190" fill="url(#attention-gradient)" />
      <path d="M354 354 670 670M670 354 354 670" fill="none" stroke="#FFFFFF" stroke-width="66" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-question" viewBox="0 0 1024 1024">
      <rect x="92" y="92" width="840" height="840" rx="190" fill="url(#attention-gradient)" />
      <path d="M390 420c8-76 62-120 126-120 74 0 126 48 126 116 0 54-28 86-78 118-46 28-58 52-58 100M506 710h8" fill="none" stroke="#FFFFFF" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-diamond" viewBox="0 0 1024 1024">
      <rect x="92" y="92" width="840" height="840" rx="190" fill="url(#attention-gradient)" />
      <path d="m512 292 220 220-220 220-220-220 220-220Z" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linejoin="round" />
      <circle cx="512" cy="512" r="26" fill="#FFFFFF" />
    </symbol>
  </defs>

  <rect width="1440" height="1200" fill="#0D1010" />
  <g fill="#F2F5F3" font-family="Arial, sans-serif">
    <text x="72" y="78" font-size="34" font-weight="700">Status Watchr favicon study</text>
    <text x="72" y="112" fill="#91A19C" font-size="17">Production candidates: default, B · Ellipses, Spark · Finished, and B · Cross · Needs attention</text>
  </g>

  <g transform="translate(72 164)">
    <text x="0" y="0" fill="#91A19C" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">LARGE REFERENCE / 192 PX</text>
    <g transform="translate(0 36)" filter="url(#shadow)"><rect width="250" height="250" rx="30" fill="#161C1C" /><svg x="29" y="29" width="192" height="192" viewBox="0 0 1024 1024"><use href="#icon-default" /></svg></g>
    <g transform="translate(320 36)" filter="url(#shadow)"><rect width="250" height="250" rx="30" fill="#161C1C" /><svg x="29" y="29" width="192" height="192" viewBox="0 0 1024 1024"><use href="#icon-working" /></svg></g>
    <g transform="translate(640 36)" filter="url(#shadow)"><rect width="250" height="250" rx="30" fill="#161C1C" /><svg x="29" y="29" width="192" height="192" viewBox="0 0 1024 1024"><use href="#icon-finished" /></svg></g>
    <g transform="translate(960 36)" filter="url(#shadow)"><rect width="250" height="250" rx="30" fill="#161C1C" /><svg x="29" y="29" width="192" height="192" viewBox="0 0 1024 1024"><use href="#icon-attention" /></svg></g>
    <g fill="#E3EAE6" font-family="Arial, sans-serif" font-size="16">
      <text x="0" y="316">Default</text><text x="320" y="316">B · Ellipses / Working</text><text x="640" y="316">Spark / Finished</text><text x="960" y="316">B · Cross / Needs attention</text>
    </g>
  </g>

  <g transform="translate(72 560)">
    <text x="0" y="0" fill="#91A19C" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">APP ICON / 64 PX</text>
    <g transform="translate(0 34)"><svg width="64" height="64" viewBox="0 0 1024 1024"><use href="#icon-default" /></svg><text x="0" y="92" fill="#E3EAE6" font-family="Arial, sans-serif" font-size="14">Default</text></g>
    <g transform="translate(176 34)"><svg width="64" height="64" viewBox="0 0 1024 1024"><use href="#icon-working" /></svg><text x="0" y="92" fill="#E3EAE6" font-family="Arial, sans-serif" font-size="14">Working</text></g>
    <g transform="translate(352 34)"><svg width="64" height="64" viewBox="0 0 1024 1024"><use href="#icon-finished" /></svg><text x="0" y="92" fill="#E3EAE6" font-family="Arial, sans-serif" font-size="14">Spark / Finished</text></g>
    <g transform="translate(528 34)"><svg width="64" height="64" viewBox="0 0 1024 1024"><use href="#icon-attention" /></svg><text x="0" y="92" fill="#E3EAE6" font-family="Arial, sans-serif" font-size="14">Cross / Attention</text></g>
  </g>

  <g transform="translate(72 760)">
    <text x="0" y="0" fill="#91A19C" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">BROWSER TAB / 32 PX</text>
    <g transform="translate(0 34)"><svg width="32" height="32" viewBox="0 0 1024 1024"><use href="#icon-default" /></svg><text x="0" y="60" fill="#E3EAE6" font-family="Arial, sans-serif" font-size="14">Default</text></g>
    <g transform="translate(176 34)"><svg width="32" height="32" viewBox="0 0 1024 1024"><use href="#icon-working" /></svg><text x="0" y="60" fill="#E3EAE6" font-family="Arial, sans-serif" font-size="14">Working</text></g>
    <g transform="translate(352 34)"><svg width="32" height="32" viewBox="0 0 1024 1024"><use href="#icon-finished" /></svg><text x="0" y="60" fill="#E3EAE6" font-family="Arial, sans-serif" font-size="14">Finished</text></g>
    <g transform="translate(528 34)"><svg width="32" height="32" viewBox="0 0 1024 1024"><use href="#icon-attention" /></svg><text x="0" y="60" fill="#E3EAE6" font-family="Arial, sans-serif" font-size="14">Attention</text></g>
  </g>

  <g transform="translate(72 934)">
    <text x="0" y="0" fill="#91A19C" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">TINY TAB / 16 PX</text>
    <g transform="translate(0 30)"><svg width="16" height="16" viewBox="0 0 1024 1024"><use href="#icon-default" /></svg></g>
    <g transform="translate(176 30)"><svg width="16" height="16" viewBox="0 0 1024 1024"><use href="#icon-working" /></svg></g>
    <g transform="translate(352 30)"><svg width="16" height="16" viewBox="0 0 1024 1024"><use href="#icon-finished" /></svg></g>
    <g transform="translate(528 30)"><svg width="16" height="16" viewBox="0 0 1024 1024"><use href="#icon-attention" /></svg></g>
    <text x="0" y="72" fill="#91A19C" font-family="Arial, sans-serif" font-size="13">At 16 px, the exclamation and check remain the clearest. The ellipses read as a single activity mark.</text>
  </g>

  <g transform="translate(820 760)">
    <text x="0" y="0" fill="#91A19C" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">NEEDS ATTENTION ALTERNATIVES / 64 PX</text>
    <g transform="translate(0 34)"><svg width="64" height="64" viewBox="0 0 1024 1024"><use href="#icon-attention" /></svg><text x="0" y="92" fill="#E3EAE6" font-family="Arial, sans-serif" font-size="14">A · Exclamation</text></g>
    <g transform="translate(176 34)"><svg width="64" height="64" viewBox="0 0 1024 1024"><use href="#icon-cross" /></svg><text x="0" y="92" fill="#E3EAE6" font-family="Arial, sans-serif" font-size="14">B · Cross / failed</text></g>
    <g transform="translate(352 34)"><svg width="64" height="64" viewBox="0 0 1024 1024"><use href="#icon-question" /></svg><text x="0" y="92" fill="#E3EAE6" font-family="Arial, sans-serif" font-size="14">C · Question / input</text></g>
    <g transform="translate(528 34)"><svg width="64" height="64" viewBox="0 0 1024 1024"><use href="#icon-diamond" /></svg><text x="0" y="92" fill="#E3EAE6" font-family="Arial, sans-serif" font-size="14">D · Diamond / signal</text></g>
  </g>
</svg>
