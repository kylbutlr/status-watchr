name: Publish macOS Sparkle update

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact native version, or empty for the next patch'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: status-watchr-macos-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: macos-26
    env:
      REQUESTED_RELEASE_VERSION: ${{ inputs.version }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      STATUS_WATCHR_CERTIFICATE_P12_BASE64: ${{ secrets.STATUS_WATCHR_CERTIFICATE_P12_BASE64 }}
      STATUS_WATCHR_CERTIFICATE_PASSWORD: ${{ secrets.STATUS_WATCHR_CERTIFICATE_PASSWORD }}
      STATUS_WATCHR_SPARKLE_PRIVATE_KEY: ${{ secrets.STATUS_WATCHR_SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the supported Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            NETLIFY_AUTH_TOKEN \
            NETLIFY_SITE_ID \
            STATUS_WATCHR_CERTIFICATE_P12_BASE64 \
            STATUS_WATCHR_CERTIFICATE_PASSWORD \
            STATUS_WATCHR_SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare trust-independent macOS signing
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          rcodesign_version="0.29.0"
          rcodesign_archive="apple-codesign-$rcodesign_version-macos-universal.tar.gz"
          rcodesign_sha256="d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d"
          rcodesign_directory="$RUNNER_TEMP/status-watchr-rcodesign"
          rcodesign_archive_path="$RUNNER_TEMP/$rcodesign_archive"
          rcodesign_path="$rcodesign_directory/rcodesign"
          certificate_path="$RUNNER_TEMP/status-watchr-signing.p12"
          password_path="$RUNNER_TEMP/status-watchr-signing-password.txt"

          echo "Decoding signing certificate."
          printf '%s' "$STATUS_WATCHR_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$STATUS_WATCHR_CERTIFICATE_PASSWORD" > "$password_path"
          chmod 600 "$certificate_path" "$password_path"

          echo "Downloading pinned rcodesign $rcodesign_version."
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/$rcodesign_version/$rcodesign_archive" \
            --output "$rcodesign_archive_path"
          actual_sha256="$(shasum -a 256 "$rcodesign_archive_path" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$rcodesign_sha256" ]]; then
            echo "rcodesign checksum mismatch." >&2
            exit 1
          fi

          echo "Extracting verified rcodesign archive."
          mkdir -p "$rcodesign_directory"
          tar -xzf "$rcodesign_archive_path" -C "$rcodesign_directory" --strip-components=1
          "$rcodesign_path" --version

          echo "STATUS_WATCHR_RCODESIGN=$rcodesign_path" >> "$GITHUB_ENV"
          echo "STATUS_WATCHR_CODESIGN_P12=$certificate_path" >> "$GITHUB_ENV"
          echo "STATUS_WATCHR_CODESIGN_PASSWORD_FILE=$password_path" >> "$GITHUB_ENV"

      - name: Resolve next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          plist="apps/macos/Resources/Info.plist"
          source_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          published_version="$(curl -fsSL -H 'Cache-Control: no-cache' https://statuswatchr.netlify.app/updates/appcast.xml | sed -n 's|.*<sparkle:shortVersionString>\([^<]*\)</sparkle:shortVersionString>.*|\1|p' | head -n 1)"
          if [[ -z "$published_version" ]]; then
            echo "The public Sparkle appcast did not contain a published version." >&2
            exit 1
          fi
          distributed_version="$(< apps/macos/Resources/latest-distributed-version.txt)"
          requested_version="$REQUESTED_RELEASE_VERSION"
          version="$(./scripts/next-macos-version.sh "$source_version" "$published_version" "$distributed_version")"
          if [[ -n "$requested_version" ]]; then
            [[ "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            version="$requested_version"
          fi

          echo "source=$source_version"
          echo "published=${published_version:-none}"
          echo "version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          swift_version="$(swift --version | sed -n 's/^Apple Swift version \([0-9.]*\).*/\1/p' | head -n 1)"
          required_version="$(sed -n 's|^// swift-tools-version: ||p' apps/macos/Package.swift | head -n 1)"
          version_number() {
            local major minor patch
            IFS=. read -r major minor patch <<< "$1"
            printf '%d%03d%03d' "$major" "${minor:-0}" "${patch:-0}"
          }

          swift --version
          xcodebuild -version
          if [[ -z "$swift_version" || -z "$required_version" ]]; then
            echo "Unable to determine the installed Swift version or package tools version." >&2
            exit 1
          fi
          if (( $(version_number "$swift_version") < $(version_number "$required_version") )); then
            echo "The macOS release runner provides Swift $swift_version, but apps/macos/Package.swift requires Swift tools $required_version." >&2
            exit 1
          fi
          echo "Swift $swift_version satisfies package tools version $required_version."

      - name: Resolve dependencies
        run: |
          swift package resolve --package-path apps/macos
          npm ci

      - name: Build and sign release artifacts
        env:
          STATUS_WATCHR_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release-macos-update.sh "${{ steps.version.outputs.version }}"

      - name: Build Netlify site
        run: npm run build

      - name: Commit and tag release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          git config user.name "Kyle Butler"
          git config user.email "kyle@sdg.la"
          [[ "$(git var GIT_AUTHOR_IDENT)" == 'Kyle Butler <kyle@sdg.la> '* ]]
          [[ "$(git var GIT_COMMITTER_IDENT)" == 'Kyle Butler <kyle@sdg.la> '* ]]
          printf '%s\n' "$version" > apps/macos/Resources/latest-distributed-version.txt
          git add apps/macos/Resources/Info.plist apps/macos/Resources/latest-distributed-version.txt public/updates
          git commit -m "Publish macOS $version Sparkle release [skip ci]"
          git tag -a "macos-v$version" -m "Status Watchr macOS $version"
          git push --dry-run origin HEAD:refs/heads/main "refs/tags/macos-v$version:refs/tags/macos-v$version"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/macos-v$version:refs/tags/macos-v$version"

      - name: Deploy production Netlify site
        run: npx --yes netlify-cli@latest deploy --prod --dir=dist --functions=netlify/functions --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"

      - name: Publish native GitHub download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd public/updates && shasum -a 256 "Status-Watchr-$RELEASE_VERSION.zip") > "$RUNNER_TEMP/SHA256SUMS"
          printf '%s\n' "Signed Apple Silicon macOS companion. Requires macOS 14+. Existing 0.1.x installations can update through Check for Updates; saved connection settings and Keychain credentials retain their established app identity. New installations use a user-configured server. This archive is signed with the established app certificate; Apple notarization is not claimed. Browser acceptance and physical phone delivery remain separate checks." > "$RUNNER_TEMP/native-release-notes.md"
          gh release create "macos-v$RELEASE_VERSION" "public/updates/Status-Watchr-$RELEASE_VERSION.zip" "$RUNNER_TEMP/SHA256SUMS" --title "Status Watchr macOS $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/native-release-notes.md" --verify-tag --latest=false

      - name: Verify public Sparkle release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          archive="https://statuswatchr.netlify.app/updates/Status-Watchr-$version.zip"
          feed="https://statuswatchr.netlify.app/updates/appcast.xml"
          curl -fsSL -H 'Cache-Control: no-cache' "$feed" | grep -F "<sparkle:shortVersionString>$version</sparkle:shortVersionString>"
          curl -fsSIL "$archive" | grep -E '^HTTP/[0-9.]+ 200'
